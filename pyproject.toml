[project]
name = "pydantic-filters"
version = "0.0.0"
description = "A declarative and intuitive way to describe data filtering and sorting in your application."
authors = [
    { name = "Nureev Insaf", email = "uneenymain@gmail.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["pydantic", "sqlalchemy", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.2,<3",
]

[project.urls]
Homepage = "https://github.com/so-saf/pydantic-filters"
Repository = "https://github.com/so-saf/pydantic-filters"
Documentation = "https://so-saf.github.io/pydantic-filters/"

[dependency-groups]
dev = [
    "coverage[toml]>=7.6.1,<8",
    "covdefaults>=2.3,<3",
    "fastapi>=0.100.0",
    "httpx2>=2.11,<3",
    "hypothesis>=6.165,<7",
    "pyrefly>=1,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "ruff>=0.4",
    "sqlalchemy>1.4,<3",
]
docs = [
    "black>=26.3.1,<27",
    "mkdocs-material>=9.5.37,<10",
    "mkdocstrings[python]>=0.26.1,<0.27",
]


[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_filters"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["pydantic_filters"]

[tool.pyrefly]
project-includes = ["pydantic_filters"]
python-version = "3.10"
